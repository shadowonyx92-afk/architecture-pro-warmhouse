version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./device_management_service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - smarthome-network

  monolith:
    build:
      context: ./monolith
      dockerfile: Dockerfile
    container_name: smarthome-monolith
    depends_on:
      postgres:
        condition: service_healthy
      device_management_service:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature_device:8081
      - LIGHT_API_URL=http://light_device:8082
      - GATE_API_URL=http://gate_device:8083
      - DEVICE_SERVICE_URL=http://device_management_service:8090
    ports:
      - "8080:8080"
    networks:
      - smarthome-network

  device_management_service:
    build:
      context: ./device_management_service
      dockerfile: Dockerfile
    container_name: device-management-service
    depends_on:
      postgres:
        condition: service_healthy
      temperature_device:
        condition: service_started
      light_device:
        condition: service_started
      gate_device:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature_device:8081
      - LIGHT_API_URL=http://light_device:8082
      - GATE_API_URL=http://gate_device:8083
      - TELEMETRY_SERVICE_URL=http://telemetry_service:8100
    ports:
      - "8090:8090"
    networks:
      - smarthome-network

  telemetry_service:
    build:
      context: ./telemetry_service
      dockerfile: Dockerfile
    container_name: telemetry-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
    ports:
      - "8100:8100"
    networks:
      - smarthome-network

  temperature_device:
    build:
      context: ./temperature_device
      dockerfile: Dockerfile
    container_name: temperature-device
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  light_device:
    build:
      context: ./light_device
      dockerfile: Dockerfile
    container_name: light-device
    ports:
      - "8082:8082"
    networks:
      - smarthome-network

  gate_device:
    build:
      context: ./gate_device
      dockerfile: Dockerfile
    container_name: gate-device
    ports:
      - "8083:8083"
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
